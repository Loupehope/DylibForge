name: AcceptanceClient
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    macOS: "${XCODEGEN_MACOS_DEPLOYMENT_TARGET}"
    iOS: "${XCODEGEN_IOS_DEPLOYMENT_TARGET}"
    watchOS: "${XCODEGEN_WATCHOS_DEPLOYMENT_TARGET}"
settings:
  base:
    GENERATE_INFOPLIST_FILE: YES
    PRODUCT_BUNDLE_IDENTIFIER: com.dylibforge.acceptance.client
    CODE_SIGN_IDENTITY: "-"
    EXTRACT_APPINTENTS_METADATA: NO
targets:
  AcceptanceMacOSTests:
    type: bundle.unit-test
    platform: macOS
    scheme:
      testTargets:
        - AcceptanceMacOSTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dylibforge.acceptance.macos-tests
        EXTRACT_APPINTENTS_METADATA: NO
    sources:
      - path: Tests
      - path: Validation/Sources
    dependencies:
      - framework: ../.build/Relinked/StaticFrameworkWithPrivateObjC.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithCxxDependency.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithDuplicateSymbols.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithDuplicateObjects.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithExcludedObject.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwift.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticLibraryWithSwift.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwiftDependency.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwiftDependentFramework.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithObjC.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithObjCAndSwift.xcframework
        embed: true
  AcceptanceiOSSimulatorTests:
    type: bundle.unit-test
    platform: iOS
    scheme:
      testTargets:
        - AcceptanceiOSSimulatorTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dylibforge.acceptance.ios-tests
        EXTRACT_APPINTENTS_METADATA: NO
    sources:
      - path: Tests
      - path: Validation/Sources
    dependencies:
      - framework: ../.build/Relinked/StaticFrameworkWithPrivateObjC.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithCxxDependency.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithDuplicateSymbols.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithDuplicateObjects.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithExcludedObject.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwift.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticLibraryWithSwift.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwiftDependency.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwiftDependentFramework.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithObjC.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithObjCAndSwift.xcframework
        embed: true
  AcceptancewatchOSSimulatorTests:
    type: bundle.unit-test
    platform: watchOS
    scheme:
      testTargets:
        - AcceptancewatchOSSimulatorTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dylibforge.acceptance.watchos-tests
        EXTRACT_APPINTENTS_METADATA: NO
    sources:
      - path: Tests
      - path: Validation/Sources
    dependencies:
      - framework: ../.build/Relinked/StaticFrameworkWithPrivateObjC.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithCxxDependency.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithDuplicateSymbols.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithDuplicateObjects.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithExcludedObject.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwift.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticLibraryWithSwift.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwiftDependency.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithSwiftDependentFramework.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithObjC.xcframework
        embed: true
      - framework: ../.build/Relinked/StaticFrameworkWithObjCAndSwift.xcframework
        embed: true
