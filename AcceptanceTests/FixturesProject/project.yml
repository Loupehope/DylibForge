  StaticFrameworkWithCxxDependency_macOS:
    templates: [static-framework]
    platform: macOS
    templateAttributes: { fixture: StaticFrameworkWithCxxDependency }
    dependencies: [{ target: StaticFrameworkWithCxxStaticDependency_macOS }]
    postBuildScripts:
      - name: Merge C++ static dependency
        basedOnDependencyAnalysis: false
        script: |
          libtool -static -o "$TARGET_TEMP_DIR/merged.a" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH" "$BUILT_PRODUCTS_DIR/libStaticFrameworkWithCxxStaticDependency.a"
          mv "$TARGET_TEMP_DIR/merged.a" "$TARGET_BUILD_DIR/$EXECUTABLE_PATH"
