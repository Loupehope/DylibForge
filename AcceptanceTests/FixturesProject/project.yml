name: Fixtures
options:
  minimumXcodeGenVersion: 2.38.0
configs:
  Debug: debug
  Release: release
targetTemplates:
  static-framework:
    type: framework
    scheme: {}
    settings:
      base:
        MACH_O_TYPE: staticlib
        SKIP_INSTALL: NO
        GENERATE_INFOPLIST_FILE: YES
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        DEFINES_MODULE: YES
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dylibforge.acceptance.fixture
    sources:
      - path: Fixtures/${fixture}/Sources
      - path: Fixtures/${fixture}/include
        buildPhase: headers
        headerVisibility: public
  static-library:
    type: library.static
    scheme: {}
    settings:
      base:
        SKIP_INSTALL: NO
        CLANG_CXX_LANGUAGE_STANDARD: c++20
        CLANG_CXX_LIBRARY: libc++
        PRODUCT_BUNDLE_IDENTIFIER: com.dylibforge.acceptance.fixture
    sources:
      - path: Fixtures/StaticFrameworkWithCxxDependency/CxxStaticDependency/Sources
  static-swift-library:
    type: library.static
    scheme: {}
    settings:
      base:
        SKIP_INSTALL: NO
        BUILD_LIBRARY_FOR_DISTRIBUTION: YES
        DEFINES_MODULE: YES
        SWIFT_VERSION: "6.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dylibforge.acceptance.fixture
    sources:
      - path: Fixtures/${fixture}/Sources
    postBuildScripts:
      - name: Install Swift module
        basedOnDependencyAnalysis: false
        script: |
          if [ "$BUILT_PRODUCTS_DIR" != "$TARGET_BUILD_DIR" ]; then
            ditto "$BUILT_PRODUCTS_DIR/$PRODUCT_MODULE_NAME.swiftmodule" "$TARGET_BUILD_DIR/$PRODUCT_MODULE_NAME.swiftmodule"
          fi
targets:
  StaticFrameworkWithPrivateObjC_macOS:
    templates: [static-framework]
    platform: macOS
    templateAttributes: { fixture: StaticFrameworkWithPrivateObjC }
    settings: { base: { PRODUCT_NAME: StaticFrameworkWithPrivateObjC, MACOSX_DEPLOYMENT_TARGET: "15.0" } }
  StaticFrameworkWithPrivateObjC_iOS:
    templates: [static-framework]
    platform: iOS
